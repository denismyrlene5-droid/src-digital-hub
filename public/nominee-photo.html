<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Private nominee photo submission</title><style>body{margin:0;background:#f6f0e5;color:#082b20;font:16px Arial,sans-serif}.wrap{max-width:680px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #c6a34d;border-radius:20px;padding:24px;box-shadow:0 12px 35px #082b2022}h1{font-family:Georgia;font-size:clamp(2rem,8vw,3rem)}label{display:grid;gap:7px;margin:18px 0;font-weight:700}input,textarea,button{font:inherit}input[type=file],textarea{padding:12px;border:1px solid #9a9a8c;border-radius:10px}textarea{min-height:90px}img{width:100%;max-height:480px;object-fit:contain;background:#eee;border-radius:12px}button{width:100%;min-height:50px;border:0;border-radius:12px;background:#0b5038;color:#fff;font-weight:700}.note{color:#5d655f;line-height:1.5}.error{color:#9b2525}</style></head><body><main class="wrap"><section class="card"><img src="/assets/ucc-wise-src-logo.jpg" alt="UCC WISE SRC logo" style="width:80px"><h1>Nominee photo submission</h1><div id="content">Loading secure form…</div></section></main><script>(()=>{const token=location.pathname.split('/').pop(),host=document.querySelector('#content'),esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('/api/nominee-photos/submit/'+encodeURIComponent(token),{cache:'no-store'}).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.message);host.innerHTML=`<h2>${esc(d.person.name)}</h2><p class="note">${d.nominations.map(n=>esc(n.category)).join('<br>')}</p><form><label>Clear portrait or class photo<input type="file" accept="image/jpeg,image/png,image/webp" required></label><img hidden alt="Selected photo preview"><label>Optional nominee message<textarea maxlength="120"></textarea></label><label>Private correction note for the admin<textarea class="correction" maxlength="500"></textarea></label><label><span><input class="consent" type="checkbox" required> I authorize the SRC to use this photo and message on the Awards website and campaign flyers.</span></label><button>Submit for review</button><p class="result" aria-live="polite"></p></form>`;const f=host.querySelector('form'),file=f.querySelector('input[type=file]'),preview=f.querySelector('img');file.onchange=()=>{const x=file.files[0];if(x){preview.src=URL.createObjectURL(x);preview.hidden=false}};f.onsubmit=async e=>{e.preventDefault();const button=f.querySelector('button'),result=f.querySelector('.result'),x=file.files[0];button.disabled=true;result.textContent='Uploading…';try{const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.onerror=reject;reader.readAsDataURL(x)}),response=await fetch('/api/nominee-photos/submit/'+encodeURIComponent(token),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:{name:x.name,type:x.type,data},message:f.querySelector('textarea').value,correctionNote:f.querySelector('.correction').value,consent:f.querySelector('.consent').checked,idempotencyKey:crypto.randomUUID()})}),body=await response.json();if(!response.ok)throw Error(body.message);f.innerHTML='<h2>Submission received</h2><p>Your photo and message are awaiting administrator review. Existing public content has not changed.</p>'}catch(err){result.textContent=err.message;result.className='result error';button.disabled=false}}}).catch(e=>host.innerHTML=`<p class="error">${esc(e.message)}</p>`);})();</script></body></html>
